name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Hovra uses macOS Accessibility APIs for system-level cursor control.
    # Run the complete Electron integration suite on its supported platform.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Electron sources
        run: npm run electron:typecheck

      - name: Build web bundle
        run: npm run build
